name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Determine release tag
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag=$(node -p "require('./manifest.json').version")
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check versions match tag
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          manifest_version=$(node -p "require('./manifest.json').version")
          package_version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest_version" ] || [ "$tag" != "$package_version" ]; then
            echo "Tag $tag does not match manifest.json ($manifest_version) or package.json ($package_version)"
            exit 1
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            manifest.json main.js styles.css
